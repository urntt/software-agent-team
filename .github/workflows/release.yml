name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Python toolchain
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Install locked project environment
        run: |
          UV_BIN="$(command -v uv)" make setup

      - name: Run repository release gates
        run: UV_BIN="$(command -v uv)" make check UV="$(command -v uv)"

      - name: Retain canonical gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: release-gate-${{ github.sha }}
          path: artifacts/generated/full-gate/
          if-no-files-found: warn
          retention-days: 0
          archive: true

      - name: Build release identity manifest
        run: |
          mkdir -p dist
          uv run --frozen python scripts/release.py \
            --tag "${GITHUB_REF_NAME}" \
            --output dist/sat-release.json
          uv run --frozen python scripts/build_bootstrap_asset.py \
            --tag "${GITHUB_REF_NAME}" \
            --output dist/bootstrap.sh
          (cd dist && sha256sum sat-release.json bootstrap.sh > SHA256SUMS)

      - name: Retain exact-tag release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: release-assets-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          archive: true

  publish:
    needs: gate
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write
    steps:
      - name: Download successful exact-tag assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          name: release-assets-${{ github.sha }}
          path: dist

      - name: Verify assets without executing project code
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("dist/sat-release.json").read_text())
          assert manifest["release_version"] == os.environ["RELEASE_TAG"].removeprefix("v")
          assert manifest["source_revision"] == os.environ["RELEASE_REVISION"]
          assert manifest["source_ref"] == os.environ["RELEASE_TAG"]
          PY

      - name: Refuse release-version reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release already exists: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Publish immutable-identity release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --latest \
            --generate-notes \
            --title "SAT ${GITHUB_REF_NAME#v}" \
            "dist/sat-release.json#SAT release identity manifest" \
            "dist/bootstrap.sh#SAT stable installation bootstrap"
