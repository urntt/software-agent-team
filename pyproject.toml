[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "software-agent-team"
version = "0.1.0"
description = "Experimental multi-agent software development harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "json5>=0.12,<1",
  "pydantic>=2.11,<3",
]

[project.scripts]
sat = "software_agent_team.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
