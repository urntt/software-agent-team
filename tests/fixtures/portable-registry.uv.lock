version = 1
revision = 3
requires-python = "==3.12.*"

[[package]]
name = "colorama"
version = "0.4.6"
source = { registry = "https://pypi.org/simple" }
wheels = [
    { url = "https://files.pythonhosted.org/packages/colorama/colorama-0.4.6-py2.py3-none-any.whl" },
]

[[package]]
name = "iniconfig"
version = "2.3.0"
source = { registry = "https://pypi.org/simple" }
wheels = [
    { url = "https://files.pythonhosted.org/packages/iniconfig/iniconfig-2.3.0-py3-none-any.whl" },
]

[[package]]
name = "markdown-link-auditor"
version = "0.1.0"
source = { editable = "." }

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = "==8.4.2" },
    { name = "ruff", specifier = "==0.12.8" },
]

[[package]]
name = "packaging"
version = "26.3"
source = { registry = "https://pypi.org/simple" }
wheels = [
    { url = "https://files.pythonhosted.org/packages/packaging/packaging-26.3-py3-none-any.whl" },
]

[[package]]
name = "pluggy"
version = "1.6.0"
source = { registry = "https://pypi.org/simple" }
wheels = [
    { url = "https://files.pythonhosted.org/packages/pluggy/pluggy-1.6.0-py3-none-any.whl" },
]

[[package]]
name = "pygments"
version = "2.20.0"
source = { registry = "https://pypi.org/simple" }
wheels = [
    { url = "https://files.pythonhosted.org/packages/pygments/pygments-2.20.0-py3-none-any.whl" },
]

[[package]]
name = "pytest"
version = "8.4.2"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "colorama", marker = "sys_platform == 'win32'" },
    { name = "iniconfig" },
    { name = "packaging" },
    { name = "pluggy" },
    { name = "pygments" },
]
wheels = [
    { url = "https://files.pythonhosted.org/packages/pytest/pytest-8.4.2-py3-none-any.whl" },
]

[[package]]
name = "ruff"
version = "0.12.8"
source = { registry = "https://pypi.org/simple" }
wheels = [
    { url = "https://files.pythonhosted.org/packages/ruff/ruff-0.12.8-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" },
]
